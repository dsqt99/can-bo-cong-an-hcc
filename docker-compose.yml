# Voice Bot AI - Docker Compose
#
# LOCAL DEV:    docker compose up --build

services:
  backend-canboai:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend-canboai
    ports:
      - "8668:8668"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8668/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - canboai-network
      - openwebui-network

  frontend-canboai:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Leave empty for auto-detection (recommended for most cases)
        # Only set for specific backend URL override
        - VITE_API_URL=${VITE_API_URL:-}
    container_name: frontend-canboai
    ports:
      - "5173:5173"
    depends_on:
      - backend-canboai
    restart: unless-stopped
    networks:
      - canboai-network

networks:
  canboai-network:
    driver: bridge
  openwebui-network:
    name: openwebui_default
    external: true

volumes:
  wlk-hf-cache:
